name: CI Pipeline

on:
  push:
    branches: [ main, infra, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    name: Run Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test Simulator Lambda
        run: python -m unittest discover -s simulator-lambda/test

      - name: Test Detector Lambda
        run: python -m unittest discover -s detector-lambda/test

      - name: Test Archiver Lambda
        run: python -m unittest discover -s archiver-lambda/test

  terraform-checks:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate